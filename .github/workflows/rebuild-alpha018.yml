name: Rebuild ALTIV Alpha 0.18

on:
  push:
    branches: [personal-ai-apk-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v4

      - name: Rebuild verified APK
        run: |
          set -euxo pipefail
          cat .bridge/alpha018/chunk-* > /tmp/alpha018.b64
          base64 -d /tmp/alpha018.b64 > ALTIV-PERSONAL-AI-Alpha-0.18.apk
          test "$(stat -c%s ALTIV-PERSONAL-AI-Alpha-0.18.apk)" = "7699942"
          echo "e2cf3dad4be79f936fd83a0c4e4cc87ad63f057e6d0c000d59aed2448587cbf8  ALTIV-PERSONAL-AI-Alpha-0.18.apk" | sha256sum -c -

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: ALTIV-PERSONAL-AI-Alpha-0.18-FINAL
          path: ALTIV-PERSONAL-AI-Alpha-0.18.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
