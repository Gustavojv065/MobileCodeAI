name: Publish ALTIV PERSONAL AI APK

on:
  push:
    branches: [personal-ai-apk-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK
        run: |
          set -euxo pipefail
          curl -fL --retry 4             "https://litter.catbox.moe/73vpm4.apk"             -o ALTIV-PERSONAL-AI-Alpha-0.19.apk
          test "$(stat -c%s ALTIV-PERSONAL-AI-Alpha-0.19.apk)" = "7701350"
          echo "93a649529706f23c4e28ab61e14bce3f2ef6ea32c4b240a218d9aea3cb887526  ALTIV-PERSONAL-AI-Alpha-0.19.apk" | sha256sum -c -

      - name: Upload exact APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALTIV-PERSONAL-AI-Alpha-0.19-FINAL
          path: ALTIV-PERSONAL-AI-Alpha-0.19.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="altiv-personal-ai-alpha-0.19"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "ALTIV PERSONAL AI Alpha 0.19"               --notes "Alpha 0.19: Smart Local, prompt leve para Gemma, roteamento aprimorado e recuperação de respostas curtas."
          gh release upload "$TAG"             ALTIV-PERSONAL-AI-Alpha-0.19.apk             --repo "$GITHUB_REPOSITORY"             --clobber
