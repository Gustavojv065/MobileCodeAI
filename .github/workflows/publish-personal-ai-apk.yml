name: Publish ALTIV PERSONAL AI APK

on:
  push:
    branches: [personal-ai-apk-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK
        run: |
          set -euxo pipefail
          curl -fL --retry 4             "https://litter.catbox.moe/3qa0by.apk"             -o ALTIV-PERSONAL-AI-Alpha-0.5.apk
          test "$(stat -c%s ALTIV-PERSONAL-AI-Alpha-0.5.apk)" = "7656142"
          echo "146837e381e673af6927415d3f0c232e52c593a26fc01fe5f7e6108bd7d90246  ALTIV-PERSONAL-AI-Alpha-0.5.apk" | sha256sum -c -

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="altiv-personal-ai-alpha-0.5"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "ALTIV PERSONAL AI Alpha 0.5"               --notes "APK de teste da Alpha 0.5: IA local + pesquisa web com fontes."
          gh release upload "$TAG"             ALTIV-PERSONAL-AI-Alpha-0.5.apk             --repo "$GITHUB_REPOSITORY"             --clobber
