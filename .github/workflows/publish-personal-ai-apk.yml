name: Publish ALTIV PERSONAL AI APK

on:
  push:
    branches: [personal-ai-apk-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK
        run: |
          set -euxo pipefail
          curl -fL --retry 4             "https://litter.catbox.moe/yzc68l.apk"             -o ALTIV-PERSONAL-AI-Alpha-0.6.apk
          test "$(stat -c%s ALTIV-PERSONAL-AI-Alpha-0.6.apk)" = "7663278"
          echo "a619a4298dabe300ab7fb0b6d6bd4d41cd65b4753c92e8235ebdf70883790f7d  ALTIV-PERSONAL-AI-Alpha-0.6.apk" | sha256sum -c -

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALTIV-PERSONAL-AI-Alpha-0.6-CHAT
          path: ALTIV-PERSONAL-AI-Alpha-0.6.apk
          if-no-files-found: error
          retention-days: 1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="altiv-personal-ai-alpha-0.6"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "ALTIV PERSONAL AI Alpha 0.6"               --notes "Alpha 0.6: descoberta automática de modelos por API, seleção automática/manual e fallback."
          gh release upload "$TAG"             ALTIV-PERSONAL-AI-Alpha-0.6.apk             --repo "$GITHUB_REPOSITORY"             --clobber
