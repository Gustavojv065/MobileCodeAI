name: Publish ALTIV PERSONAL AI APK

on:
  push:
    branches: [personal-ai-apk-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK
        run: |
          set -euxo pipefail
          curl -fL --retry 4             "https://litter.catbox.moe/pj9ez6.apk"             -o ALTIV-PERSONAL-AI-Alpha-0.12.apk
          test "$(stat -c%s ALTIV-PERSONAL-AI-Alpha-0.12.apk)" = "7686102"
          echo "2e1c70376a5e6f441ce2d3f306631f85becac6ff68e1b0147c94b21facf7d3a3  ALTIV-PERSONAL-AI-Alpha-0.12.apk" | sha256sum -c -

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALTIV-PERSONAL-AI-Alpha-0.12-CHAT
          path: ALTIV-PERSONAL-AI-Alpha-0.12.apk
          if-no-files-found: error
          retention-days: 1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="altiv-personal-ai-alpha-0.12"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "ALTIV PERSONAL AI Alpha 0.12"               --notes "Alpha 0.12: downloader nativo Android, teste de conexão, fallback e erros persistentes para modelos locais."
          gh release upload "$TAG"             ALTIV-PERSONAL-AI-Alpha-0.12.apk             --repo "$GITHUB_REPOSITORY"             --clobber
