name: Publish ALTIV PERSONAL AI APK

on:
  push:
    branches: [personal-ai-apk-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK
        run: |
          set -euxo pipefail
          curl -fL --retry 4             "https://litter.catbox.moe/se47fi.apk"             -o ALTIV-PERSONAL-AI-Alpha-0.11.apk
          test "$(stat -c%s ALTIV-PERSONAL-AI-Alpha-0.11.apk)" = "7683314"
          echo "ecf5fee0b454c5eb0bfd2ab6234693f27de5d00b2c68249063a7ab616435887c  ALTIV-PERSONAL-AI-Alpha-0.11.apk" | sha256sum -c -

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALTIV-PERSONAL-AI-Alpha-0.11-CHAT
          path: ALTIV-PERSONAL-AI-Alpha-0.11.apk
          if-no-files-found: error
          retention-days: 1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="altiv-personal-ai-alpha-0.11"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "ALTIV PERSONAL AI Alpha 0.11"               --notes "Alpha 0.11: gerenciador local Qwen + Llama, downloader robusto e Ollama externo esclarecido."
          gh release upload "$TAG"             ALTIV-PERSONAL-AI-Alpha-0.11.apk             --repo "$GITHUB_REPOSITORY"             --clobber
