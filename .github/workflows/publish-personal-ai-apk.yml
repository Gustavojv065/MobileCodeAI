name: Publish ALTIV PERSONAL AI APK

on:
  push:
    branches: [personal-ai-apk-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK
        run: |
          set -euxo pipefail
          curl -fL --retry 4             "https://litter.catbox.moe/2f7gej.apk"             -o ALTIV-PERSONAL-AI-Alpha-0.13.apk
          test "$(stat -c%s ALTIV-PERSONAL-AI-Alpha-0.13.apk)" = "7686618"
          echo "6022ac9595c6aa402e977ea0a1b692230efd1f262a50bcdf55f166950186675d  ALTIV-PERSONAL-AI-Alpha-0.13.apk" | sha256sum -c -

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="altiv-personal-ai-alpha-0.13"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "ALTIV PERSONAL AI Alpha 0.13"               --notes "Alpha 0.13: instalador offline de modelos isolado do downloader de mídia."
          gh release upload "$TAG"             ALTIV-PERSONAL-AI-Alpha-0.13.apk             --repo "$GITHUB_REPOSITORY"             --clobber
