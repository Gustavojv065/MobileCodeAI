name: Publish ALTIV PERSONAL AI APK

on:
  push:
    branches: [personal-ai-apk-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK
        run: |
          set -euxo pipefail
          curl -fL --retry 4             "https://litter.catbox.moe/rvnk9r.apk"             -o ALTIV-PERSONAL-AI-Alpha-0.9.apk
          test "$(stat -c%s ALTIV-PERSONAL-AI-Alpha-0.9.apk)" = "7676038"
          echo "5221396927641070d9e2fa4e151fbac57ced60474d839990a0582de0bf475d87  ALTIV-PERSONAL-AI-Alpha-0.9.apk" | sha256sum -c -

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALTIV-PERSONAL-AI-Alpha-0.9-CHAT
          path: ALTIV-PERSONAL-AI-Alpha-0.9.apk
          if-no-files-found: error
          retention-days: 1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="altiv-personal-ai-alpha-0.9"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "ALTIV PERSONAL AI Alpha 0.9"               --notes "Alpha 0.9: visão multimodal, criação/edição de imagem com OpenAI e diagramas locais."
          gh release upload "$TAG"             ALTIV-PERSONAL-AI-Alpha-0.9.apk             --repo "$GITHUB_REPOSITORY"             --clobber
