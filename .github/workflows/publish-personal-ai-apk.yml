name: Publish ALTIV PERSONAL AI APK

on:
  push:
    branches: [personal-ai-apk-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK
        run: |
          set -euxo pipefail
          curl -fL --retry 4             "https://litter.catbox.moe/niw0ip.apk"             -o ALTIV-PERSONAL-AI-Alpha-0.18.apk
          test "$(stat -c%s ALTIV-PERSONAL-AI-Alpha-0.18.apk)" = "7698766"
          echo "3949e8f182087a36613db71b1165bb7e7d800079fa763113ffc21457c1913d30  ALTIV-PERSONAL-AI-Alpha-0.18.apk" | sha256sum -c -

      - name: Upload exact APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALTIV-PERSONAL-AI-Alpha-0.18-FINAL
          path: ALTIV-PERSONAL-AI-Alpha-0.18.apk
          if-no-files-found: error
          retention-days: 1

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="altiv-personal-ai-alpha-0.18"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "ALTIV PERSONAL AI Alpha 0.18"               --notes "Alpha 0.18: Gemma 3 270M ultra-light local model, alongside Qwen and Llama."
          gh release upload "$TAG"             ALTIV-PERSONAL-AI-Alpha-0.18.apk             --repo "$GITHUB_REPOSITORY"             --clobber
