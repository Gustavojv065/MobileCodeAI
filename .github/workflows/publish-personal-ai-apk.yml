name: Publish ALTIV PERSONAL AI APK

on:
  push:
    branches: [personal-ai-apk-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK
        run: |
          set -euxo pipefail
          curl -fL --retry 4             "https://litter.catbox.moe/r39h6m.apk"             -o ALTIV-PERSONAL-AI-Alpha-0.15.apk
          test "$(stat -c%s ALTIV-PERSONAL-AI-Alpha-0.15.apk)" = "7694246"
          echo "e0c264bb40ea2ac066f054cc3cbd2ddabd85b7a4880f06d75506dc3b2e7756c3  ALTIV-PERSONAL-AI-Alpha-0.15.apk" | sha256sum -c -

      - name: Upload exact APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALTIV-PERSONAL-AI-Alpha-0.15-FINAL
          path: ALTIV-PERSONAL-AI-Alpha-0.15.apk
          if-no-files-found: error
          retention-days: 1

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="altiv-personal-ai-alpha-0.15"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "ALTIV PERSONAL AI Alpha 0.15"               --notes "Alpha 0.15: download turbo paralelo, velocidade em MB/s e ETA."
          gh release upload "$TAG"             ALTIV-PERSONAL-AI-Alpha-0.15.apk             --repo "$GITHUB_REPOSITORY"             --clobber
